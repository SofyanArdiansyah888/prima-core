services:
  app:
    build:
      context: ./dashboard
      dockerfile: docker/php/Dockerfile
    container_name: pkm-dashboard-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./dashboard:/var/www/html
    env_file:
      - ./dashboard/.env
    networks:
      - pkm

  nginx:
    image: nginx:1.27-alpine
    container_name: pkm-dashboard-nginx
    restart: unless-stopped
    volumes:
      - ./dashboard:/var/www/html:ro
      - ./dashboard/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pkm
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.school-api.rule=Host(`pkm.orcaid.cloud`)"
      - "traefik.http.routers.school-api.entrypoints=websecure"
      - "traefik.http.routers.school-api.tls=true"
      - "traefik.http.routers.school-api.tls.certresolver=le"
      - "traefik.http.services.school-api.loadbalancer.server.port=80"

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://pkm.orcaid.cloud
    container_name: pkm-mobile-pwa
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.pkm-mobile.rule=Host(`mobile-pkm.orcaid.cloud`)"
      - "traefik.http.routers.pkm-mobile.entrypoints=websecure"
      - "traefik.http.routers.pkm-mobile.tls=true"
      - "traefik.http.routers.pkm-mobile.tls.certresolver=le"
      - "traefik.http.services.pkm-mobile.loadbalancer.server.port=80"

networks:
  pkm:
    driver: bridge
  traefik-public:
    external: true
