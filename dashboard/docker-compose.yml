services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pkm-dashboard-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    networks:
      - pkm

  nginx:
    image: nginx:1.27-alpine
    container_name: pkm-dashboard-nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pkm
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.school-api.rule=Host(`pkm.orcaid.cloud`)"
      - "traefik.http.routers.school-api.entrypoints=websecure"
      - "traefik.http.routers.school-api.tls=true"
      - "traefik.http.routers.school-api.tls.certresolver=le"
      - "traefik.http.services.school-api.loadbalancer.server.port=80"

networks:
  pkm:
    driver: bridge
  traefik-public:
    external: true
