# PKM Dashboard — Docker (app runtime). PostgreSQL default = remote via .env
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pkm-dashboard-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
    depends_on:
      - mailpit
    networks:
      - pkm

  nginx:
    image: nginx:1.27-alpine
    container_name: pkm-dashboard-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pkm

  mailpit:
    image: axllent/mailpit:latest
    container_name: pkm-dashboard-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - pkm

  # Optional offline PostgreSQL — not the default path
  # docker compose --profile local-db up -d
  postgres:
    profiles: ["local-db"]
    image: postgres:16
    container_name: pkm-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pkm_dashboard}
      POSTGRES_USER: ${DB_USERNAME:-pkm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    networks:
      - pkm

networks:
  pkm:
    driver: bridge
